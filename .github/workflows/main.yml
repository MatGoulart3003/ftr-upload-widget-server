 name: widget-server-pipe-ecr

 on:
   push:
     branches: [ main ]

 jobs: 
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@v6
              with:
                node-version: 24

            - name: Setup pnpm
              id: setup-pnpm
              uses: pnpm/action-setup@v6
              with:
                version: 10

            - name: Install dependencies
              id: install-dependencies
              run: |
                pnpm install    

            - name: Configure AWS Credentials
              id: configure-aws-credentials
              uses: aws-actions/configure-aws-credentials@v6.1.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2


            - name: Set up Docker Buildx
              id: setup-buildx
              uses: docker/setup-buildx-action@v4

            - name: Generate tag
              id: generate-tag
              run: | 
                SHA=$(echo $GITHUB_SHA | head -c7)
                echo "sha=$SHA" >> $GITHUB_OUTPUT

            - name: Build and export image
              id: build-and-export-image
              uses: docker/build-push-action@v7
              with:
                context: .
                load: true
                cache-from: type=gha                
                cache-to: type=gha,mode=max
                tags: |
                  ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:test

            - name: Run Trivy vulnerability scanner
              id: trivy-scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:test'
                format: 'table'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'


            - name: Build and push image to Amazon ECR
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                cache-from: type=gha
                tags: |
                   ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.generate-tag.outputs.sha }}

            - name: Deploy to App Runner
              id: deploy-app-runner
              uses: awslabs/amazon-app-runner-deploy@main
              with:
                service: ${{ vars.APP_RUNNER_SERVICE_NAME }}
                image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.generate-tag.outputs.sha }}
                region: ${{ vars.AWS_REGION }}
                access-role-arn: ${{ secrets.ROLE_ARN }}
                cpu: 1
                memory: 2
                port: 3333
                wait-for-service-stability-seconds: 180
            
            - name: App Runner Check
              id: app-runner-check
              run: echo "App Running... ${{ steps.deploy-app-runner.outputs.service-url }}" 